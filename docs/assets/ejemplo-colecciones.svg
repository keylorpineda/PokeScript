<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" role="img" aria-label="Ejemplo de PokeScript con equipo, mochila y ciclos">
  <defs><clipPath id="ventana"><rect width="900" height="750" rx="16"/></clipPath></defs>
  <style>
    text { font-family: Consolas, 'JetBrains Mono', 'Fira Code', Menlo, 'Courier New', monospace; font-size: 15px; }
    .n { fill: #4b5080; text-anchor: end; }
    .id { fill: #d6deeb; } .k { fill: #c792ea; font-weight: 700; } .f { fill: #82aaff; }
    .s { fill: #c3e88d; } .num { fill: #f78c6c; } .op { fill: #89ddff; } .lit { fill: #f78c6c; font-weight: 700; }
    .c { fill: #637777; font-style: italic; } .cte { fill: #ffcb6b; } .tn { fill: #7fdbca; } .tw { fill: #ffcb6b; }
    .ty-roca { fill: #d4bc4a; font-weight: 700; } .ty-agua { fill: #7fa6ff; font-weight: 700; } .ty-fuego { fill: #ff9a4d; font-weight: 700; } .ty-planta { fill: #8fd46a; font-weight: 700; } .ty-electrico { fill: #ffd84a; font-weight: 700; }
    .linea { opacity: 0; animation: entrar 0.35s ease-out forwards; }
    .aparece { opacity: 0; animation: entrar 0.45s ease-out forwards; }
    @keyframes entrar { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    .pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 0.5s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    .cursor { opacity: 0; animation: mostrar 0.01s forwards, parpadeo 0.9s step-end infinite; }
    @keyframes mostrar { to { opacity: 1; } }
    @keyframes parpadeo { 50% { fill: transparent; } }
    .punto { animation: latido 1.6s ease-in-out infinite; }
    @keyframes latido { 50% { opacity: 0.35; } }
    .onda { stroke-dasharray: 400; stroke-dashoffset: 400; animation: trazar 0.8s ease-out forwards; }
    @keyframes trazar { to { stroke-dashoffset: 0; } }
    .resalte { opacity: 0; animation: resaltar 0.4s forwards, latir 1.8s ease-in-out infinite; }
    @keyframes resaltar { to { opacity: 1; } }
    @keyframes latir { 50% { fill-opacity: 0.08; } }
  </style>
  <g clip-path="url(#ventana)">
    <rect width="900" height="750" fill="#1b1d36"/>
    <rect width="900" height="44" fill="#121328"/>
    <circle cx="24" cy="22" r="7" fill="#ff5f57"/><circle cx="46" cy="22" r="7" fill="#febc2e"/><circle cx="68" cy="22" r="7" fill="#28c840"/>
    <rect x="96" y="8" width="190.8" height="36" rx="8" fill="#1b1d36"/>
    <circle cx="114" cy="26" r="6" fill="#ee1515"/><rect x="108" y="25" width="12" height="2" fill="#121328"/>
    <text x="128" y="31" style="font-size:14px" fill="#e6e9ff">entrenamiento.pks</text>
    <circle class="punto" cx="872" cy="22" r="5" fill="#78c850"/>
    <!-- Código -->
    <g class="linea" style="animation-delay:0.10s"><text x="44" y="78" class="n">1</text><text y="78"><tspan x="62" textLength="423" lengthAdjust="spacingAndGlyphs" class="c">// entrenamiento.pks · equipo, mochila y ciclos</tspan></text></g>
    <g class="linea" style="animation-delay:0.19s"><text x="44" y="101" class="n">2</text><text y="101"><tspan x="62" textLength="63" lengthAdjust="spacingAndGlyphs" class="k">combate</tspan></text></g>
    <g class="linea" style="animation-delay:0.28s"><text x="44" y="124" class="n">3</text><text y="124"><tspan x="98" textLength="54" lengthAdjust="spacingAndGlyphs" class="tw">equipo</tspan><tspan x="161" textLength="18" lengthAdjust="spacingAndGlyphs" class="tw">de</tspan><tspan x="188" textLength="54" lengthAdjust="spacingAndGlyphs" class="ty-planta">planta</tspan><tspan x="251" textLength="81" lengthAdjust="spacingAndGlyphs" class="id">mi_equipo</tspan><tspan x="341" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">=</tspan><tspan x="359" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">[</tspan><tspan x="368" textLength="81" lengthAdjust="spacingAndGlyphs" class="s">"Pikachu"</tspan><tspan x="449" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="467" textLength="108" lengthAdjust="spacingAndGlyphs" class="s">"Charmander"</tspan><tspan x="575" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="593" textLength="90" lengthAdjust="spacingAndGlyphs" class="s">"Squirtle"</tspan><tspan x="683" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">]</tspan></text></g>
    <g class="linea" style="animation-delay:0.37s"><text x="44" y="147" class="n">4</text><text y="147"><tspan x="98" textLength="45" lengthAdjust="spacingAndGlyphs" class="k">sumar</tspan><tspan x="152" textLength="99" lengthAdjust="spacingAndGlyphs" class="s">"Bulbasaur"</tspan><tspan x="260" textLength="9" lengthAdjust="spacingAndGlyphs" class="tw">a</tspan><tspan x="278" textLength="81" lengthAdjust="spacingAndGlyphs" class="id">mi_equipo</tspan></text></g>
    <g class="linea" style="animation-delay:0.46s"><text x="44" y="170" class="n">5</text><text y="170"><tspan x="98" textLength="54" lengthAdjust="spacingAndGlyphs" class="k">gritar</tspan><tspan x="161" textLength="162" lengthAdjust="spacingAndGlyphs" class="s">"Tu equipo tiene "</tspan><tspan x="323" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="341" textLength="54" lengthAdjust="spacingAndGlyphs" class="k">tamaño</tspan><tspan x="395" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">(</tspan><tspan x="404" textLength="81" lengthAdjust="spacingAndGlyphs" class="id">mi_equipo</tspan><tspan x="485" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">)</tspan><tspan x="494" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="512" textLength="90" lengthAdjust="spacingAndGlyphs" class="s">" Pokémon"</tspan></text></g>
    <g class="linea" style="animation-delay:0.55s"><text x="44" y="193" class="n">6</text></g>
    <g class="linea" style="animation-delay:0.64s"><text x="44" y="216" class="n">7</text><text y="216"><tspan x="98" textLength="63" lengthAdjust="spacingAndGlyphs" class="tw">mochila</tspan><tspan x="170" textLength="18" lengthAdjust="spacingAndGlyphs" class="tw">de</tspan><tspan x="197" textLength="54" lengthAdjust="spacingAndGlyphs" class="ty-planta">planta</tspan><tspan x="260" textLength="9" lengthAdjust="spacingAndGlyphs" class="tw">a</tspan><tspan x="278" textLength="36" lengthAdjust="spacingAndGlyphs" class="ty-roca">roca</tspan><tspan x="323" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">bayas</tspan><tspan x="377" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">=</tspan><tspan x="395" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">{</tspan><tspan x="404" textLength="72" lengthAdjust="spacingAndGlyphs" class="s">"Aranja"</tspan><tspan x="476" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">:</tspan><tspan x="494" textLength="9" lengthAdjust="spacingAndGlyphs" class="num">3</tspan><tspan x="503" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="521" textLength="63" lengthAdjust="spacingAndGlyphs" class="s">"Zreza"</tspan><tspan x="584" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">:</tspan><tspan x="602" textLength="9" lengthAdjust="spacingAndGlyphs" class="num">0</tspan><tspan x="611" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="629" textLength="63" lengthAdjust="spacingAndGlyphs" class="s">"Meloc"</tspan><tspan x="692" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">:</tspan><tspan x="710" textLength="9" lengthAdjust="spacingAndGlyphs" class="num">5</tspan><tspan x="719" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">}</tspan></text></g>
    <g class="linea" style="animation-delay:0.73s"><text x="44" y="239" class="n">8</text><text y="239"><tspan x="98" textLength="72" lengthAdjust="spacingAndGlyphs" class="k">recorrer</tspan><tspan x="179" textLength="36" lengthAdjust="spacingAndGlyphs" class="id">baya</tspan><tspan x="215" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="233" textLength="72" lengthAdjust="spacingAndGlyphs" class="id">cantidad</tspan><tspan x="314" textLength="18" lengthAdjust="spacingAndGlyphs" class="k">en</tspan><tspan x="341" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">bayas</tspan></text></g>
    <g class="linea" style="animation-delay:0.82s"><text x="44" y="262" class="n">9</text><text y="262"><tspan x="134" textLength="18" lengthAdjust="spacingAndGlyphs" class="k">si</tspan><tspan x="161" textLength="72" lengthAdjust="spacingAndGlyphs" class="id">cantidad</tspan><tspan x="242" textLength="45" lengthAdjust="spacingAndGlyphs" class="k">igual</tspan><tspan x="296" textLength="9" lengthAdjust="spacingAndGlyphs" class="num">0</tspan></text></g>
    <g class="linea" style="animation-delay:0.91s"><text x="44" y="285" class="n">10</text><text y="285"><tspan x="170" textLength="81" lengthAdjust="spacingAndGlyphs" class="k">siguiente</tspan></text></g>
    <g class="linea" style="animation-delay:1.00s"><text x="44" y="308" class="n">11</text><text y="308"><tspan x="134" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <g class="linea" style="animation-delay:1.09s"><text x="44" y="331" class="n">12</text><text y="331"><tspan x="134" textLength="54" lengthAdjust="spacingAndGlyphs" class="k">gritar</tspan><tspan x="197" textLength="36" lengthAdjust="spacingAndGlyphs" class="s">"  "</tspan><tspan x="233" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="251" textLength="36" lengthAdjust="spacingAndGlyphs" class="id">baya</tspan><tspan x="287" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="305" textLength="36" lengthAdjust="spacingAndGlyphs" class="s">" x"</tspan><tspan x="341" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="359" textLength="72" lengthAdjust="spacingAndGlyphs" class="id">cantidad</tspan></text></g>
    <g class="linea" style="animation-delay:1.18s"><text x="44" y="354" class="n">13</text><text y="354"><tspan x="98" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <g class="linea" style="animation-delay:1.27s"><text x="44" y="377" class="n">14</text></g>
    <g class="linea" style="animation-delay:1.36s"><text x="44" y="400" class="n">15</text><text y="400"><tspan x="98" textLength="36" lengthAdjust="spacingAndGlyphs" class="ty-roca">roca</tspan><tspan x="143" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">nivel</tspan><tspan x="197" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">=</tspan><tspan x="215" textLength="9" lengthAdjust="spacingAndGlyphs" class="num">5</tspan></text></g>
    <g class="linea" style="animation-delay:1.45s"><text x="44" y="423" class="n">16</text><text y="423"><tspan x="98" textLength="72" lengthAdjust="spacingAndGlyphs" class="k">mientras</tspan><tspan x="179" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">nivel</tspan><tspan x="233" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">&lt;</tspan><tspan x="251" textLength="18" lengthAdjust="spacingAndGlyphs" class="num">10</tspan></text></g>
    <g class="linea" style="animation-delay:1.54s"><text x="44" y="446" class="n">17</text><text y="446"><tspan x="134" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">nivel</tspan><tspan x="188" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">=</tspan><tspan x="206" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">nivel</tspan><tspan x="260" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">+</tspan><tspan x="278" textLength="9" lengthAdjust="spacingAndGlyphs" class="num">2</tspan></text></g>
    <g class="linea" style="animation-delay:1.63s"><text x="44" y="469" class="n">18</text><text y="469"><tspan x="98" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <g class="linea" style="animation-delay:1.72s"><text x="44" y="492" class="n">19</text><text y="492"><tspan x="98" textLength="54" lengthAdjust="spacingAndGlyphs" class="k">gritar</tspan><tspan x="161" textLength="135" lengthAdjust="spacingAndGlyphs" class="s">"Nivel final: "</tspan><tspan x="296" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="314" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">nivel</tspan></text></g>
    <g class="linea" style="animation-delay:1.81s"><text x="44" y="515" class="n">20</text><text y="515"><tspan x="62" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <!-- Salida -->
    <rect x="0" y="545" width="900" height="205" fill="#121328"/>
    <rect x="0" y="545" width="900" height="1" fill="#2c3060"/>
    <text x="24" y="573" style="font-size:12px; letter-spacing:2px" fill="#6b70a8">SALIDA</text>
    <g class="aparece" style="animation-delay:2.40s"><text x="24" y="603"><tspan fill="#78c850" font-weight="700">✔ ¡Es superefectivo!</tspan><tspan fill="#8b90c0"> Compilación sin errores</tspan></text></g>
    <g class="aparece" style="animation-delay:2.85s"><text x="24" y="630"><tspan fill="#e6e9ff">Tu equipo tiene 4 Pokémon</tspan></text></g>
    <g class="aparece" style="animation-delay:3.30s"><text x="24" y="657"><tspan fill="#e6e9ff">  Aranja x3</tspan></text></g>
    <g class="aparece" style="animation-delay:3.75s"><text x="24" y="684"><tspan fill="#e6e9ff">  Meloc x5</tspan></text></g>
    <g class="aparece" style="animation-delay:4.20s"><text x="24" y="711"><tspan fill="#e6e9ff">Nivel final: 11</tspan></text></g>
    <rect class="cursor" style="animation-delay:4.65s, 4.65s" x="24" y="724" width="9" height="17" fill="#ffcb05"/>
  </g>
</svg>
