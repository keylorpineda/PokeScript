version: '2'

run:
  timeout: 5m

linters:
  default: standard
  # misspell no se usa: solo conoce inglés. CSpell revisa la ortografía en español e inglés.
  enable:
    - revive
    - unconvert
    - gocyclo
    - errorlint
  settings:
    errcheck:
      # Escribir en la terminal o en un búfer no tiene un error útil que manejar.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocyclo:
      # El parser y el analizador tienen switches grandes; subir con criterio.
      min-complexity: 30
    revive:
      rules:
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
