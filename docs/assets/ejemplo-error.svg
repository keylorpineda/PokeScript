<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 462" width="900" height="462" role="img" aria-label="PokeScript detecta un bloque mientras sin cerrar y dice en qué línea se abrió">
  <defs><clipPath id="ventana"><rect width="900" height="462" rx="16"/></clipPath></defs>
  <style>
    text { font-family: Consolas, 'JetBrains Mono', 'Fira Code', Menlo, 'Courier New', monospace; font-size: 15px; }
    .n { fill: #4b5080; text-anchor: end; }
    .id { fill: #d6deeb; } .k { fill: #c792ea; font-weight: 700; } .f { fill: #82aaff; }
    .s { fill: #c3e88d; } .num { fill: #f78c6c; } .op { fill: #89ddff; } .lit { fill: #f78c6c; font-weight: 700; }
    .c { fill: #637777; font-style: italic; } .cte { fill: #ffcb6b; } .tn { fill: #7fdbca; } .tw { fill: #ffcb6b; }
    .ty-roca { fill: #d4bc4a; font-weight: 700; } .ty-agua { fill: #7fa6ff; font-weight: 700; } .ty-fuego { fill: #ff9a4d; font-weight: 700; } .ty-planta { fill: #8fd46a; font-weight: 700; } .ty-electrico { fill: #ffd84a; font-weight: 700; }
    .linea { opacity: 0; animation: entrar 0.35s ease-out forwards; }
    .aparece { opacity: 0; animation: entrar 0.45s ease-out forwards; }
    @keyframes entrar { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    .pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 0.5s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    .cursor { opacity: 0; animation: mostrar 0.01s forwards, parpadeo 0.9s step-end infinite; }
    @keyframes mostrar { to { opacity: 1; } }
    @keyframes parpadeo { 50% { fill: transparent; } }
    .punto { animation: latido 1.6s ease-in-out infinite; }
    @keyframes latido { 50% { opacity: 0.35; } }
    .onda { stroke-dasharray: 400; stroke-dashoffset: 400; animation: trazar 0.8s ease-out forwards; }
    @keyframes trazar { to { stroke-dashoffset: 0; } }
    .resalte { opacity: 0; animation: resaltar 0.4s forwards, latir 1.8s ease-in-out infinite; }
    @keyframes resaltar { to { opacity: 1; } }
    @keyframes latir { 50% { fill-opacity: 0.08; } }
  </style>
  <g clip-path="url(#ventana)">
    <rect width="900" height="462" fill="#1b1d36"/>
    <rect width="900" height="44" fill="#121328"/>
    <circle cx="24" cy="22" r="7" fill="#ff5f57"/><circle cx="46" cy="22" r="7" fill="#febc2e"/><circle cx="68" cy="22" r="7" fill="#28c840"/>
    <rect x="96" y="8" width="140.4" height="36" rx="8" fill="#1b1d36"/>
    <circle cx="114" cy="26" r="6" fill="#ee1515"/><rect x="108" y="25" width="12" height="2" fill="#121328"/>
    <text x="128" y="31" style="font-size:14px" fill="#e6e9ff">captura.pks</text>
    <circle class="punto" cx="872" cy="22" r="5" fill="#ff5f57"/>
    <rect class="resalte" style="animation-delay:2s, 2.4s" x="0" y="177" width="900" height="23" fill="#ff5f57" fill-opacity="0.16"/>
    <!-- Código -->
    <g class="linea" style="animation-delay:0.10s"><text x="44" y="78" class="n">1</text><text y="78"><tspan x="62" textLength="333" lengthAdjust="spacingAndGlyphs" class="c">// captura.pks · ¿dónde quedó el fin?</tspan></text></g>
    <g class="linea" style="animation-delay:0.19s"><text x="44" y="101" class="n">2</text><text y="101"><tspan x="62" textLength="63" lengthAdjust="spacingAndGlyphs" class="k">combate</tspan></text></g>
    <g class="linea" style="animation-delay:0.28s"><text x="44" y="124" class="n">3</text><text y="124"><tspan x="98" textLength="54" lengthAdjust="spacingAndGlyphs" class="ty-planta">planta</tspan><tspan x="161" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan></text></g>
    <g class="linea" style="animation-delay:0.37s"><text x="44" y="147" class="n">4</text><text y="147"><tspan x="98" textLength="72" lengthAdjust="spacingAndGlyphs" class="k">capturar</tspan><tspan x="170" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">(</tspan><tspan x="179" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan><tspan x="233" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="251" textLength="99" lengthAdjust="spacingAndGlyphs" class="s">"¿Nombre? "</tspan><tspan x="350" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">)</tspan></text></g>
    <g class="linea" style="animation-delay:0.46s"><text x="44" y="170" class="n">5</text><text y="170"><tspan x="98" textLength="36" lengthAdjust="spacingAndGlyphs" class="ty-roca">roca</tspan><tspan x="143" textLength="72" lengthAdjust="spacingAndGlyphs" class="id">intentos</tspan><tspan x="224" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">=</tspan><tspan x="242" textLength="9" lengthAdjust="spacingAndGlyphs" class="num">0</tspan></text></g>
    <g class="linea" style="animation-delay:0.55s"><text x="44" y="193" class="n">6</text><text y="193"><tspan x="98" textLength="72" lengthAdjust="spacingAndGlyphs" class="k">mientras</tspan><tspan x="179" textLength="72" lengthAdjust="spacingAndGlyphs" class="id">intentos</tspan><tspan x="260" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">&lt;</tspan><tspan x="278" textLength="9" lengthAdjust="spacingAndGlyphs" class="num">3</tspan></text></g>
    <g class="linea" style="animation-delay:0.64s"><text x="44" y="216" class="n">7</text><text y="216"><tspan x="134" textLength="72" lengthAdjust="spacingAndGlyphs" class="id">intentos</tspan><tspan x="215" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">=</tspan><tspan x="233" textLength="72" lengthAdjust="spacingAndGlyphs" class="id">intentos</tspan><tspan x="314" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">+</tspan><tspan x="332" textLength="9" lengthAdjust="spacingAndGlyphs" class="num">1</tspan></text></g>
    <g class="linea" style="animation-delay:0.73s"><text x="44" y="239" class="n">8</text><text y="239"><tspan x="134" textLength="18" lengthAdjust="spacingAndGlyphs" class="k">si</tspan><tspan x="161" textLength="72" lengthAdjust="spacingAndGlyphs" class="id">intentos</tspan><tspan x="242" textLength="45" lengthAdjust="spacingAndGlyphs" class="k">igual</tspan><tspan x="296" textLength="9" lengthAdjust="spacingAndGlyphs" class="num">3</tspan></text></g>
    <g class="linea" style="animation-delay:0.82s"><text x="44" y="262" class="n">9</text><text y="262"><tspan x="170" textLength="54" lengthAdjust="spacingAndGlyphs" class="k">gritar</tspan><tspan x="233" textLength="27" lengthAdjust="spacingAndGlyphs" class="s">"¡"</tspan><tspan x="260" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="278" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan><tspan x="332" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="350" textLength="108" lengthAdjust="spacingAndGlyphs" class="s">" atrapado!"</tspan></text></g>
    <g class="linea" style="animation-delay:0.91s"><text x="44" y="285" class="n">10</text><text y="285"><tspan x="134" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <g class="linea" style="animation-delay:1.00s"><text x="44" y="308" class="n">11</text><text y="308"><tspan x="62" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <path class="onda" style="animation-delay:2s" d="M98 199 L102 196 L106 199 L110 196 L114 199 L118 196 L122 199 L126 196 L130 199 L134 196 L138 199 L142 196 L146 199 L150 196 L154 199 L158 196 L162 199 L166 196 L170 199" fill="none" stroke="#ff5f57" stroke-width="2"/>
    <g class="pop" style="animation-delay:2.5s">
      <rect x="470" y="62" width="406" height="236" rx="12" fill="#23264a" stroke="#3a3f7a" stroke-width="1.5"/>
      <rect x="470" y="62" width="6" height="236" rx="3" fill="#ff5f57"/>
      <text x="494" y="92" style="font-size:12px; letter-spacing:2px; font-weight:700" fill="#ff5f57">ERROR SINTÁCTICO · LÍNEA 11</text>
      <text x="494" y="122" style="font-size:16px; font-weight:700" fill="#e6e9ff">¡Se escapó!</text>
      <text x="494" y="154" style="font-size:13.5px" fill="#b8bde8">El bloque <tspan fill="#c792ea" font-weight="700">combate</tspan> de la <tspan fill="#ffcb6b" font-weight="700">línea 2</tspan> nunca se cerró.</text>
      <text x="494" y="176" style="font-size:13.5px" fill="#b8bde8">Por la sangría, parece que falta el <tspan fill="#c792ea" font-weight="700">fin</tspan></text>
      <text x="494" y="198" style="font-size:13.5px" fill="#b8bde8">del <tspan fill="#c792ea" font-weight="700">mientras</tspan> que abriste en la <tspan fill="#ffcb6b" font-weight="700">línea 6</tspan>.</text>
      <rect x="494" y="248" width="125.5" height="32" rx="8" fill="#ff5f57"/>
      <text x="556.75" y="269" style="font-size:14px; font-weight:700" fill="#121328" text-anchor="middle">Agregar fin</text>
    </g>
    <!-- Salida -->
    <rect x="0" y="338" width="900" height="124" fill="#121328"/>
    <rect x="0" y="338" width="900" height="1" fill="#2c3060"/>
    <text x="24" y="366" style="font-size:12px; letter-spacing:2px" fill="#6b70a8">SALIDA</text>
    <g class="aparece" style="animation-delay:2.50s"><text x="24" y="396"><tspan fill="#ff5f57" font-weight="700">✖ ¡Se escapó!</tspan><tspan fill="#8b90c0"> 1 error · captura.pks:11</tspan></text></g>
    <g class="aparece" style="animation-delay:2.95s"><text x="24" y="423"><tspan fill="#8b90c0">El programa no se ejecuta hasta corregirlo.</tspan></text></g>
    <rect class="cursor" style="animation-delay:3.40s, 3.40s" x="24" y="436" width="9" height="17" fill="#ffcb05"/>
  </g>
</svg>
