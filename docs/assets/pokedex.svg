<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Pokédex con la entrada de PokeScript: un lenguaje en español para aprender a programar">
  <defs>
    <clipPath id="pantalla"><rect x="84" y="158" width="732" height="186" rx="6"/></clipPath>
    <radialGradient id="lente" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#b8e4ff"/><stop offset="0.45" stop-color="#3d9cf0"/><stop offset="1" stop-color="#15508f"/>
    </radialGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3223a"/><stop offset="1" stop-color="#b3101f"/>
    </linearGradient>
  </defs>
  <style>
    .brillo { animation: brillo 2.4s ease-in-out infinite; }
    @keyframes brillo { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } }
    .led { animation: led 1.8s steps(1) infinite; }
    .l2 { animation-delay: 0.6s; } .l3 { animation-delay: 1.2s; }
    @keyframes led { 0% { opacity: 1; } 33% { opacity: 0.25; } }
    .barrido { animation: barrido 3.5s linear infinite; }
    @keyframes barrido { from { transform: translateY(0); } to { transform: translateY(190px); } }
    @keyframes pdx0 { to { transform: translateX(194px); } }
    @keyframes pdx1 { to { transform: translateX(264px); } }
    @keyframes pdx2 { to { transform: translateX(494px); } }
    @keyframes pdx3 { to { transform: translateX(484px); } }
    @keyframes pdx4 { to { transform: translateX(344px); } }
    @keyframes pdx5 { to { transform: translateX(544px); } }
  </style>
  <rect x="20" y="20" width="860" height="360" rx="26" fill="url(#cuerpo)" stroke="#7a0a15" stroke-width="4"/>
  <path d="M20 118 H300 L340 78 H880" fill="none" stroke="#7a0a15" stroke-width="4"/>
  <circle cx="92" cy="72" r="40" fill="#f4f4f4" stroke="#7a0a15" stroke-width="4"/>
  <circle cx="92" cy="72" r="31" fill="url(#lente)"/>
  <circle class="brillo" cx="92" cy="72" r="31" fill="#b8e4ff"/>
  <circle cx="82" cy="61" r="8" fill="#ffffff" opacity="0.8"/>
  <circle class="led" cx="160" cy="52" r="9" fill="#ff5f57" stroke="#7a0a15" stroke-width="2"/>
  <circle class="led l2" cx="188" cy="52" r="9" fill="#ffcb05" stroke="#7a0a15" stroke-width="2"/>
  <circle class="led l3" cx="216" cy="52" r="9" fill="#5fd35f" stroke="#7a0a15" stroke-width="2"/>
  <text x="850" y="80" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="15" font-weight="700" fill="#ffd9dd" text-anchor="end">PokeScript · UNA 2026</text>
  <rect x="60" y="140" width="780" height="218" rx="12" fill="#dcdcdc" stroke="#7a0a15" stroke-width="3"/>
  <circle cx="78" cy="152" r="4" fill="#e3223a"/><circle cx="92" cy="152" r="4" fill="#e3223a"/>
  <rect x="84" y="158" width="732" height="186" rx="6" fill="#10231a"/>
  <g clip-path="url(#pantalla)">
    <text x="104" y="184" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#ffcb05" textLength="190" lengthAdjust="spacingAndGlyphs">Nº 001 · POKESCRIPT</text>
    <rect x="102" y="167" width="196" height="25" fill="#10231a" style="animation: pdx0 0.53s steps(19, end) 0.80s both"/>
    <text x="104" y="208" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#7fd8a0" textLength="260" lengthAdjust="spacingAndGlyphs">TIPO: LENGUAJE / EDUCATIVO</text>
    <rect x="102" y="191" width="266" height="25" fill="#10231a" style="animation: pdx1 0.73s steps(26, end) 1.53s both"/>
    <text x="104" y="256" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" fill="#d8f5e0" textLength="490" lengthAdjust="spacingAndGlyphs">Un lenguaje en español para aprender a programar.</text>
    <rect x="102" y="239" width="496" height="25" fill="#10231a" style="animation: pdx2 1.37s steps(49, end) 2.46s both"/>
    <text x="104" y="280" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" fill="#d8f5e0" textLength="480" lengthAdjust="spacingAndGlyphs">Cada dato tiene un tipo y, como en los combates,</text>
    <rect x="102" y="263" width="486" height="25" fill="#10231a" style="animation: pdx3 1.34s steps(48, end) 4.03s both"/>
    <text x="104" y="304" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" fill="#d8f5e0" textLength="340" lengthAdjust="spacingAndGlyphs">no todos los tipos se llevan bien.</text>
    <rect x="102" y="287" width="346" height="25" fill="#10231a" style="animation: pdx4 0.95s steps(34, end) 5.58s both"/>
    <text x="104" y="328" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" fill="#d8f5e0" textLength="540" lengthAdjust="spacingAndGlyphs">Cuando algo falla, te dice qué pasó y cómo arreglarlo.</text>
    <rect x="102" y="311" width="546" height="25" fill="#10231a" style="animation: pdx5 1.51s steps(54, end) 6.73s both"/>
  </g>
  <rect class="barrido" x="84" y="158" width="732" height="3" fill="#7fd8a0" opacity="0.18"/>
</svg>
