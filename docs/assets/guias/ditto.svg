<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Ditto: Cambiar de forma es lo mío, pero aquí se pide con convertir. Ojo: convertir(agua) a roca corta los decimales; para redondear está redondear.">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecd0f4"/><stop offset="1" stop-color="#a070c0"/></linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="0.5" stop-color="#a070c0" stop-opacity="0.45"/><stop offset="1" stop-color="#a070c0" stop-opacity="0"/></radialGradient>
    <clipPath id="dialogo"><rect x="241" y="42" width="628" height="148"/></clipPath>
