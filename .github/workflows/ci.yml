name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Mensajes de commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validar commits del PR
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Validar commits del push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: pnpm exec commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
      - name: Validar último commit (primer push de la rama)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: pnpm exec commitlint --last --verbose

  standards:
    name: Formato, markdown y ortografía
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm run format:check
      - name: Markdownlint
        run: pnpm run lint:md
      - name: CSpell
        run: pnpm run spell

  detect:
    name: Detectar partes del proyecto
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          [ -f go.mod ] && echo "go=true" >> "$GITHUB_OUTPUT" || echo "go=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  go:
    name: Compilador (Go)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formato (gofmt)
        run: |
          sin_formato=$(gofmt -l ./internal ./cmd)
          if [ -n "$sin_formato" ]; then
            echo "Archivos sin gofmt:"; echo "$sin_formato"; exit 1
          fi
      - name: go vet
        run: go vet ./internal/... ./cmd/...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4
          args: ./internal/... ./cmd/...
      - name: Pruebas
        run: go test -race -cover ./internal/... ./cmd/...

  frontend:
    name: Interfaz (Svelte)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
