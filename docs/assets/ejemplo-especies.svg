<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 907" width="900" height="907" role="img" aria-label="Ejemplo de PokeScript con especie, ficha, segun y movimientos">
  <defs><clipPath id="ventana"><rect width="900" height="907" rx="16"/></clipPath></defs>
  <style>
    text { font-family: Consolas, 'JetBrains Mono', 'Fira Code', Menlo, 'Courier New', monospace; font-size: 15px; }
    .n { fill: #4b5080; text-anchor: end; }
    .id { fill: #d6deeb; } .k { fill: #c792ea; font-weight: 700; } .f { fill: #82aaff; }
    .s { fill: #c3e88d; } .num { fill: #f78c6c; } .op { fill: #89ddff; } .lit { fill: #f78c6c; font-weight: 700; }
    .c { fill: #637777; font-style: italic; } .cte { fill: #ffcb6b; } .tn { fill: #7fdbca; } .tw { fill: #ffcb6b; }
    .ty-roca { fill: #d4bc4a; font-weight: 700; } .ty-agua { fill: #7fa6ff; font-weight: 700; } .ty-fuego { fill: #ff9a4d; font-weight: 700; } .ty-planta { fill: #8fd46a; font-weight: 700; } .ty-electrico { fill: #ffd84a; font-weight: 700; }
    .linea { opacity: 0; animation: entrar 0.35s ease-out forwards; }
    .aparece { opacity: 0; animation: entrar 0.45s ease-out forwards; }
    @keyframes entrar { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    .pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 0.5s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    .cursor { opacity: 0; animation: mostrar 0.01s forwards, parpadeo 0.9s step-end infinite; }
    @keyframes mostrar { to { opacity: 1; } }
    @keyframes parpadeo { 50% { fill: transparent; } }
    .punto { animation: latido 1.6s ease-in-out infinite; }
    @keyframes latido { 50% { opacity: 0.35; } }
    .onda { stroke-dasharray: 400; stroke-dashoffset: 400; animation: trazar 0.8s ease-out forwards; }
    @keyframes trazar { to { stroke-dashoffset: 0; } }
    .resalte { opacity: 0; animation: resaltar 0.4s forwards, latir 1.8s ease-in-out infinite; }
    @keyframes resaltar { to { opacity: 1; } }
    @keyframes latir { 50% { fill-opacity: 0.08; } }
  </style>
  <g clip-path="url(#ventana)">
    <rect width="900" height="907" fill="#1b1d36"/>
    <rect width="900" height="44" fill="#121328"/>
    <circle cx="24" cy="22" r="7" fill="#ff5f57"/><circle cx="46" cy="22" r="7" fill="#febc2e"/><circle cx="68" cy="22" r="7" fill="#28c840"/>
    <rect x="96" y="8" width="140.4" height="36" rx="8" fill="#1b1d36"/>
    <circle cx="114" cy="26" r="6" fill="#ee1515"/><rect x="108" y="25" width="12" height="2" fill="#121328"/>
    <text x="128" y="31" style="font-size:14px" fill="#e6e9ff">estados.pks</text>
    <circle class="punto" cx="872" cy="22" r="5" fill="#78c850"/>
    <!-- Código -->
    <g class="linea" style="animation-delay:0.10s"><text x="44" y="78" class="n">1</text><text y="78"><tspan x="62" textLength="468" lengthAdjust="spacingAndGlyphs" class="c">// estados.pks · especie, ficha, segun y movimientos</tspan></text></g>
    <g class="linea" style="animation-delay:0.18s"><text x="44" y="101" class="n">2</text><text y="101"><tspan x="62" textLength="63" lengthAdjust="spacingAndGlyphs" class="k">especie</tspan><tspan x="134" textLength="54" lengthAdjust="spacingAndGlyphs" class="tn">Estado</tspan></text></g>
    <g class="linea" style="animation-delay:0.26s"><text x="44" y="124" class="n">3</text><text y="124"><tspan x="98" textLength="36" lengthAdjust="spacingAndGlyphs" class="cte">SANO</tspan><tspan x="134" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="152" textLength="90" lengthAdjust="spacingAndGlyphs" class="cte">ENVENENADO</tspan><tspan x="242" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="260" textLength="63" lengthAdjust="spacingAndGlyphs" class="cte">DORMIDO</tspan></text></g>
    <g class="linea" style="animation-delay:0.34s"><text x="44" y="147" class="n">4</text><text y="147"><tspan x="62" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <g class="linea" style="animation-delay:0.41s"><text x="44" y="170" class="n">5</text></g>
    <g class="linea" style="animation-delay:0.49s"><text x="44" y="193" class="n">6</text><text y="193"><tspan x="62" textLength="45" lengthAdjust="spacingAndGlyphs" class="k">ficha</tspan><tspan x="116" textLength="63" lengthAdjust="spacingAndGlyphs" class="tn">Pokemon</tspan></text></g>
    <g class="linea" style="animation-delay:0.57s"><text x="44" y="216" class="n">7</text><text y="216"><tspan x="98" textLength="54" lengthAdjust="spacingAndGlyphs" class="ty-planta">planta</tspan><tspan x="161" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan></text></g>
    <g class="linea" style="animation-delay:0.65s"><text x="44" y="239" class="n">8</text><text y="239"><tspan x="98" textLength="36" lengthAdjust="spacingAndGlyphs" class="ty-roca">roca</tspan><tspan x="161" textLength="36" lengthAdjust="spacingAndGlyphs" class="id">vida</tspan></text></g>
    <g class="linea" style="animation-delay:0.73s"><text x="44" y="262" class="n">9</text><text y="262"><tspan x="98" textLength="54" lengthAdjust="spacingAndGlyphs" class="tn">Estado</tspan><tspan x="161" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">estado</tspan></text></g>
    <g class="linea" style="animation-delay:0.81s"><text x="44" y="285" class="n">10</text><text y="285"><tspan x="62" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <g class="linea" style="animation-delay:0.89s"><text x="44" y="308" class="n">11</text></g>
    <g class="linea" style="animation-delay:0.96s"><text x="44" y="331" class="n">12</text><text y="331"><tspan x="62" textLength="90" lengthAdjust="spacingAndGlyphs" class="k">movimiento</tspan><tspan x="161" textLength="36" lengthAdjust="spacingAndGlyphs" class="ty-roca">roca</tspan><tspan x="206" textLength="99" lengthAdjust="spacingAndGlyphs" class="f">pasar_turno</tspan><tspan x="305" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">(</tspan><tspan x="314" textLength="63" lengthAdjust="spacingAndGlyphs" class="tn">Pokemon</tspan><tspan x="386" textLength="9" lengthAdjust="spacingAndGlyphs" class="id">p</tspan><tspan x="395" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">)</tspan></text></g>
    <g class="linea" style="animation-delay:1.04s"><text x="44" y="354" class="n">13</text><text y="354"><tspan x="98" textLength="36" lengthAdjust="spacingAndGlyphs" class="ty-roca">roca</tspan><tspan x="143" textLength="36" lengthAdjust="spacingAndGlyphs" class="id">dano</tspan><tspan x="188" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">=</tspan><tspan x="206" textLength="9" lengthAdjust="spacingAndGlyphs" class="num">0</tspan></text></g>
    <g class="linea" style="animation-delay:1.12s"><text x="44" y="377" class="n">14</text><text y="377"><tspan x="98" textLength="45" lengthAdjust="spacingAndGlyphs" class="k">segun</tspan><tspan x="152" textLength="9" lengthAdjust="spacingAndGlyphs" class="id">p</tspan><tspan x="161" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">.</tspan><tspan x="170" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">estado</tspan></text></g>
    <g class="linea" style="animation-delay:1.20s"><text x="44" y="400" class="n">15</text><text y="400"><tspan x="134" textLength="36" lengthAdjust="spacingAndGlyphs" class="cte">SANO</tspan><tspan x="242" textLength="72" lengthAdjust="spacingAndGlyphs" class="k">entonces</tspan><tspan x="323" textLength="54" lengthAdjust="spacingAndGlyphs" class="k">gritar</tspan><tspan x="386" textLength="9" lengthAdjust="spacingAndGlyphs" class="id">p</tspan><tspan x="395" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">.</tspan><tspan x="404" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan><tspan x="458" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="476" textLength="198" lengthAdjust="spacingAndGlyphs" class="s">" está en plena forma"</tspan></text></g>
    <g class="linea" style="animation-delay:1.28s"><text x="44" y="423" class="n">16</text><text y="423"><tspan x="134" textLength="90" lengthAdjust="spacingAndGlyphs" class="cte">ENVENENADO</tspan><tspan x="242" textLength="72" lengthAdjust="spacingAndGlyphs" class="k">entonces</tspan><tspan x="323" textLength="36" lengthAdjust="spacingAndGlyphs" class="id">dano</tspan><tspan x="368" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">=</tspan><tspan x="386" textLength="18" lengthAdjust="spacingAndGlyphs" class="num">10</tspan></text></g>
    <g class="linea" style="animation-delay:1.36s"><text x="44" y="446" class="n">17</text><text y="446"><tspan x="134" textLength="63" lengthAdjust="spacingAndGlyphs" class="cte">DORMIDO</tspan><tspan x="242" textLength="72" lengthAdjust="spacingAndGlyphs" class="k">entonces</tspan><tspan x="323" textLength="54" lengthAdjust="spacingAndGlyphs" class="k">gritar</tspan><tspan x="386" textLength="9" lengthAdjust="spacingAndGlyphs" class="id">p</tspan><tspan x="395" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">.</tspan><tspan x="404" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan><tspan x="458" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="476" textLength="153" lengthAdjust="spacingAndGlyphs" class="s">" sigue dormido…"</tspan></text></g>
    <g class="linea" style="animation-delay:1.44s"><text x="44" y="469" class="n">18</text><text y="469"><tspan x="98" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <g class="linea" style="animation-delay:1.51s"><text x="44" y="492" class="n">19</text><text y="492"><tspan x="98" textLength="72" lengthAdjust="spacingAndGlyphs" class="k">entregar</tspan><tspan x="179" textLength="9" lengthAdjust="spacingAndGlyphs" class="id">p</tspan><tspan x="188" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">.</tspan><tspan x="197" textLength="36" lengthAdjust="spacingAndGlyphs" class="id">vida</tspan><tspan x="242" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">-</tspan><tspan x="260" textLength="36" lengthAdjust="spacingAndGlyphs" class="id">dano</tspan></text></g>
    <g class="linea" style="animation-delay:1.59s"><text x="44" y="515" class="n">20</text><text y="515"><tspan x="62" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <g class="linea" style="animation-delay:1.67s"><text x="44" y="538" class="n">21</text></g>
    <g class="linea" style="animation-delay:1.75s"><text x="44" y="561" class="n">22</text><text y="561"><tspan x="62" textLength="63" lengthAdjust="spacingAndGlyphs" class="k">combate</tspan></text></g>
    <g class="linea" style="animation-delay:1.83s"><text x="44" y="584" class="n">23</text><text y="584"><tspan x="98" textLength="63" lengthAdjust="spacingAndGlyphs" class="tn">Pokemon</tspan><tspan x="170" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">bulbi</tspan><tspan x="224" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">=</tspan><tspan x="242" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">{</tspan><tspan x="251" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan><tspan x="305" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">:</tspan><tspan x="323" textLength="99" lengthAdjust="spacingAndGlyphs" class="s">"Bulbasaur"</tspan><tspan x="422" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="440" textLength="36" lengthAdjust="spacingAndGlyphs" class="id">vida</tspan><tspan x="476" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">:</tspan><tspan x="494" textLength="18" lengthAdjust="spacingAndGlyphs" class="num">45</tspan><tspan x="512" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="530" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">estado</tspan><tspan x="584" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">:</tspan><tspan x="602" textLength="90" lengthAdjust="spacingAndGlyphs" class="cte">ENVENENADO</tspan><tspan x="692" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">}</tspan></text></g>
    <g class="linea" style="animation-delay:1.91s"><text x="44" y="607" class="n">24</text><text y="607"><tspan x="98" textLength="72" lengthAdjust="spacingAndGlyphs" class="k">recorrer</tspan><tspan x="179" textLength="9" lengthAdjust="spacingAndGlyphs" class="id">t</tspan><tspan x="197" textLength="18" lengthAdjust="spacingAndGlyphs" class="tw">de</tspan><tspan x="224" textLength="9" lengthAdjust="spacingAndGlyphs" class="num">1</tspan><tspan x="242" textLength="45" lengthAdjust="spacingAndGlyphs" class="k">hasta</tspan><tspan x="296" textLength="9" lengthAdjust="spacingAndGlyphs" class="num">3</tspan></text></g>
    <g class="linea" style="animation-delay:1.99s"><text x="44" y="630" class="n">25</text><text y="630"><tspan x="134" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">bulbi</tspan><tspan x="179" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">.</tspan><tspan x="188" textLength="36" lengthAdjust="spacingAndGlyphs" class="id">vida</tspan><tspan x="233" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">=</tspan><tspan x="251" textLength="99" lengthAdjust="spacingAndGlyphs" class="f">pasar_turno</tspan><tspan x="350" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">(</tspan><tspan x="359" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">bulbi</tspan><tspan x="404" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">)</tspan></text></g>
    <g class="linea" style="animation-delay:2.06s"><text x="44" y="653" class="n">26</text><text y="653"><tspan x="134" textLength="54" lengthAdjust="spacingAndGlyphs" class="k">gritar</tspan><tspan x="197" textLength="72" lengthAdjust="spacingAndGlyphs" class="s">"Turno "</tspan><tspan x="269" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="287" textLength="9" lengthAdjust="spacingAndGlyphs" class="id">t</tspan><tspan x="296" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="314" textLength="36" lengthAdjust="spacingAndGlyphs" class="s">": "</tspan><tspan x="350" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="368" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">bulbi</tspan><tspan x="413" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">.</tspan><tspan x="422" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan><tspan x="476" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="494" textLength="81" lengthAdjust="spacingAndGlyphs" class="s">" tiene "</tspan><tspan x="575" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="593" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">bulbi</tspan><tspan x="638" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">.</tspan><tspan x="647" textLength="36" lengthAdjust="spacingAndGlyphs" class="id">vida</tspan><tspan x="683" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="701" textLength="45" lengthAdjust="spacingAndGlyphs" class="s">" PS"</tspan></text></g>
    <g class="linea" style="animation-delay:2.14s"><text x="44" y="676" class="n">27</text><text y="676"><tspan x="98" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <g class="linea" style="animation-delay:2.22s"><text x="44" y="699" class="n">28</text><text y="699"><tspan x="62" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <g class="pop" style="animation-delay:3.2s">
      <rect x="500" y="92" width="376" height="212" rx="12" fill="#23264a" stroke="#3a3f7a" stroke-width="1.5"/>
      <rect x="500" y="92" width="6" height="212" rx="3" fill="#ffcb05"/>
      <text x="524" y="122" style="font-size:12px; letter-spacing:2px; font-weight:700" fill="#ffcb05">SI BORRAS LA RAMA DORMIDO…</text>
      <text x="524" y="152" style="font-size:16px; font-weight:700" fill="#e6e9ff">No es muy efectivo…</text>
      <text x="524" y="184" style="font-size:13.5px" fill="#b8bde8">El <tspan fill="#c792ea" font-weight="700">segun</tspan> sobre <tspan fill="#7fdbca">Estado</tspan> no cubre todos</text>
      <text x="524" y="206" style="font-size:13.5px" fill="#b8bde8">los casos. Falta: <tspan fill="#ffcb6b" font-weight="700">DORMIDO</tspan>.</text>
      <text x="524" y="228" style="font-size:13.5px" fill="#b8bde8">El compilador te nombra cada caso</text>
      <text x="524" y="250" style="font-size:13.5px" fill="#b8bde8">que olvidaste. ¡Ninguno se escapa!</text>
    </g>
    <!-- Salida -->
    <rect x="0" y="729" width="900" height="178" fill="#121328"/>
    <rect x="0" y="729" width="900" height="1" fill="#2c3060"/>
    <text x="24" y="757" style="font-size:12px; letter-spacing:2px" fill="#6b70a8">SALIDA</text>
    <g class="aparece" style="animation-delay:2.80s"><text x="24" y="787"><tspan fill="#78c850" font-weight="700">✔ ¡Es superefectivo!</tspan><tspan fill="#8b90c0"> segun cubre SANO, ENVENENADO y DORMIDO</tspan></text></g>
    <g class="aparece" style="animation-delay:3.25s"><text x="24" y="814"><tspan fill="#e6e9ff">Turno 1: Bulbasaur tiene 35 PS</tspan></text></g>
    <g class="aparece" style="animation-delay:3.70s"><text x="24" y="841"><tspan fill="#e6e9ff">Turno 2: Bulbasaur tiene 25 PS</tspan></text></g>
    <g class="aparece" style="animation-delay:4.15s"><text x="24" y="868"><tspan fill="#e6e9ff">Turno 3: Bulbasaur tiene 15 PS</tspan></text></g>
    <rect class="cursor" style="animation-delay:4.60s, 4.60s" x="24" y="881" width="9" height="17" fill="#ffcb05"/>
  </g>
</svg>
