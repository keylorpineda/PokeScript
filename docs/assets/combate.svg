<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Un error de tipos contado como un combate: ROCA usa + contra ELECTRICO y no es muy efectivo">
  <defs>
    <linearGradient id="campo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8e8f8"/><stop offset="0.55" stop-color="#e8f4d8"/><stop offset="1" stop-color="#a8d890"/>
    </linearGradient>
    <clipPath id="marco"><rect width="900" height="440" rx="16"/></clipPath>
    <clipPath id="dialogo"><rect x="36" y="362" width="828" height="62"/></clipPath>
  </defs>
  <style>
    .entra-rival { animation: entraRival 0.6s ease-out both; }
    @keyframes entraRival { from { transform: translateX(260px); } }
    .entra-propio { animation: entraPropio 0.6s ease-out both; }
    @keyframes entraPropio { from { transform: translateX(-260px); } }
    .embiste { animation: embiste 0.5s ease-in-out 2.06s both; }
    @keyframes embiste { 50% { transform: translate(60px, -30px); } }
    .sacude { transform-box: fill-box; transform-origin: center; animation: sacude 0.5s ease-in-out 2.31s both; }
    @keyframes sacude { 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
    .chispa { opacity: 0; animation: chispa 0.5s ease-out 2.31s both; }
    @keyframes chispa { 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4); } }
    .limpiar { opacity: 0; animation: limpiar 0.01s 5.22s both; }
    @keyframes limpiar { to { opacity: 1; } }
    .flecha { animation: flecha 0.8s steps(1) infinite; }
    @keyframes flecha { 50% { opacity: 0; } }
    @keyframes cmbA0 { to { transform: translateX(323px); } }
    @keyframes cmbA1 { to { transform: translateX(213px); } }
    @keyframes cmbB0 { to { transform: translateX(477px); } }
    @keyframes cmbB1 { to { transform: translateX(367px); } }
  </style>
  <g clip-path="url(#marco)">
    <rect width="900" height="440" fill="url(#campo)"/>
    <ellipse cx="660" cy="176" rx="150" ry="30" fill="#b8d888" stroke="#88b060" stroke-width="3"/>
    <ellipse cx="230" cy="306" rx="170" ry="34" fill="#b8d888" stroke="#88b060" stroke-width="3"/>
    <g>
    <rect x="40" y="36" width="300" height="76" rx="10" fill="#fbfbf5" stroke="#383838" stroke-width="4"/>
    <text x="60" y="68" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="20" font-weight="700" fill="#282828">ELECTRICO</text>
    <text x="320" y="68" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="17" font-weight="700" fill="#282828" text-anchor="end">Nv.5</text>
    <text x="60" y="94" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="13" font-weight="700" fill="#e08a00">PS</text>
    <rect x="86" y="84" width="232" height="12" rx="6" fill="#484848"/>
    <rect x="89" y="87" width="226" height="6" rx="3" fill="#48d048"/>
    
  </g>
    <g>
    <rect x="560" y="212" width="300" height="96" rx="10" fill="#fbfbf5" stroke="#383838" stroke-width="4"/>
    <text x="580" y="244" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="20" font-weight="700" fill="#282828">ROCA</text>
    <text x="840" y="244" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="17" font-weight="700" fill="#282828" text-anchor="end">Nv.5</text>
    <text x="580" y="270" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="13" font-weight="700" fill="#e08a00">PS</text>
    <rect x="606" y="260" width="232" height="12" rx="6" fill="#484848"/>
    <rect x="609" y="263" width="226" height="6" rx="3" fill="#48d048"/>
    <text x="840" y="298" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="16" font-weight="700" fill="#282828" text-anchor="end">35/35</text>
  </g>
    <g class="entra-rival"><g class="sacude"><g >
      <circle cx="660" cy="118" r="54" fill="#ffffff"/>
      <path d="M606 118 a54 54 0 0 1 108 0 z" fill="#f8d030"/>
      <rect x="606" y="112.6" width="108" height="10.8" fill="#1b1b1b"/>
      <circle cx="660" cy="118" r="54" fill="none" stroke="#1b1b1b" stroke-width="5.4"/>
      <circle cx="660" cy="118" r="17.82" fill="#1b1b1b"/>
      <circle cx="660" cy="118" r="10.8" fill="#ffffff"/>
    </g></g></g>
    <g class="chispa" transform-origin="660 118"><circle cx="660" cy="118" r="70" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="10 14"/></g>
    <g class="entra-propio"><g class="embiste"><g >
      <circle cx="230" cy="244" r="62" fill="#ffffff"/>
      <path d="M168 244 a62 62 0 0 1 124 0 z" fill="#b8a038"/>
      <rect x="168" y="237.8" width="124" height="12.4" fill="#1b1b1b"/>
      <circle cx="230" cy="244" r="62" fill="none" stroke="#1b1b1b" stroke-width="6.2"/>
      <circle cx="230" cy="244" r="20.46" fill="#1b1b1b"/>
      <circle cx="230" cy="244" r="12.4" fill="#ffffff"/>
    </g></g></g>
    <rect x="20" y="350" width="860" height="82" rx="12" fill="#fbfbf5" stroke="#383838" stroke-width="5"/>
    <rect x="28" y="358" width="844" height="66" rx="8" fill="none" stroke="#c8c8c0" stroke-width="2"/>
    <g clip-path="url(#dialogo)">
    <text x="52" y="388" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="400" fill="#282828" textLength="319" lengthAdjust="spacingAndGlyphs">¡ROCA usó + contra ELECTRICO!</text>
    <rect x="50" y="369" width="325" height="27" fill="#fbfbf5" style="animation: cmbA0 1.16s steps(29, end) 0.70s both"/>
    <text x="52" y="418" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="400" fill="#c0392b" textLength="209" lengthAdjust="spacingAndGlyphs">No es muy efectivo…</text>
    <rect x="50" y="399" width="215" height="27" fill="#fbfbf5" style="animation: cmbA1 0.76s steps(19, end) 3.06s both"/>
      <g class="limpiar">
        <rect x="36" y="362" width="828" height="62" fill="#fbfbf5"/>
    <text x="52" y="388" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="400" fill="#282828" textLength="473" lengthAdjust="spacingAndGlyphs">No se puede sumar un roca con un electrico.</text>
    <rect x="50" y="369" width="479" height="27" fill="#fbfbf5" style="animation: cmbB0 1.72s steps(43, end) 5.52s both"/>
    <text x="52" y="418" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="400" fill="#2a5caa" textLength="363" lengthAdjust="spacingAndGlyphs">Revisa la tabla de efectividades.</text>
    <rect x="50" y="399" width="369" height="27" fill="#fbfbf5" style="animation: cmbB1 1.32s steps(33, end) 7.54s both"/>
      </g>
    </g>
    <path class="flecha" d="M842 408 l10 0 l-5 8 z" fill="#c0392b"/>
  </g>
</svg>
