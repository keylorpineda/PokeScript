<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 773" width="900" height="773" role="img" aria-label="Ejemplo de PokeScript que pide datos con capturar y valida la entrada">
  <defs><clipPath id="ventana"><rect width="900" height="773" rx="16"/></clipPath></defs>
  <style>
    text { font-family: Consolas, 'JetBrains Mono', 'Fira Code', Menlo, 'Courier New', monospace; font-size: 15px; }
    .n { fill: #4b5080; text-anchor: end; }
    .id { fill: #d6deeb; } .k { fill: #c792ea; font-weight: 700; } .f { fill: #82aaff; }
    .s { fill: #c3e88d; } .num { fill: #f78c6c; } .op { fill: #89ddff; } .lit { fill: #f78c6c; font-weight: 700; }
    .c { fill: #637777; font-style: italic; } .cte { fill: #ffcb6b; } .tn { fill: #7fdbca; } .tw { fill: #ffcb6b; }
    .ty-roca { fill: #d4bc4a; font-weight: 700; } .ty-agua { fill: #7fa6ff; font-weight: 700; } .ty-fuego { fill: #ff9a4d; font-weight: 700; } .ty-planta { fill: #8fd46a; font-weight: 700; } .ty-electrico { fill: #ffd84a; font-weight: 700; }
    .linea { opacity: 0; animation: entrar 0.35s ease-out forwards; }
    .aparece { opacity: 0; animation: entrar 0.45s ease-out forwards; }
    @keyframes entrar { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    .pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 0.5s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    .cursor { opacity: 0; animation: mostrar 0.01s forwards, parpadeo 0.9s step-end infinite; }
    @keyframes mostrar { to { opacity: 1; } }
    @keyframes parpadeo { 50% { fill: transparent; } }
    .punto { animation: latido 1.6s ease-in-out infinite; }
    @keyframes latido { 50% { opacity: 0.35; } }
    .onda { stroke-dasharray: 400; stroke-dashoffset: 400; animation: trazar 0.8s ease-out forwards; }
    @keyframes trazar { to { stroke-dashoffset: 0; } }
    .resalte { opacity: 0; animation: resaltar 0.4s forwards, latir 1.8s ease-in-out infinite; }
    @keyframes resaltar { to { opacity: 1; } }
    @keyframes latir { 50% { fill-opacity: 0.08; } }
  </style>
  <g clip-path="url(#ventana)">
    <rect width="900" height="773" fill="#1b1d36"/>
    <rect width="900" height="44" fill="#121328"/>
    <circle cx="24" cy="22" r="7" fill="#ff5f57"/><circle cx="46" cy="22" r="7" fill="#febc2e"/><circle cx="68" cy="22" r="7" fill="#28c840"/>
    <rect x="96" y="8" width="132" height="36" rx="8" fill="#1b1d36"/>
    <circle cx="114" cy="26" r="6" fill="#ee1515"/><rect x="108" y="25" width="12" height="2" fill="#121328"/>
    <text x="128" y="31" style="font-size:14px" fill="#e6e9ff">centro.pks</text>
    <circle class="punto" cx="872" cy="22" r="5" fill="#78c850"/>
    <!-- Código -->
    <g class="linea" style="animation-delay:0.10s"><text x="44" y="78" class="n">1</text><text y="78"><tspan x="62" textLength="396" lengthAdjust="spacingAndGlyphs" class="c">// centro.pks · capturar, contiene y sino si</tspan></text></g>
    <g class="linea" style="animation-delay:0.19s"><text x="44" y="101" class="n">2</text><text y="101"><tspan x="62" textLength="90" lengthAdjust="spacingAndGlyphs" class="k">movimiento</tspan><tspan x="161" textLength="81" lengthAdjust="spacingAndGlyphs" class="ty-electrico">electrico</tspan><tspan x="251" textLength="117" lengthAdjust="spacingAndGlyphs" class="f">es_legendario</tspan><tspan x="368" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">(</tspan><tspan x="377" textLength="54" lengthAdjust="spacingAndGlyphs" class="ty-planta">planta</tspan><tspan x="440" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan><tspan x="494" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">)</tspan></text></g>
    <g class="linea" style="animation-delay:0.28s"><text x="44" y="124" class="n">3</text><text y="124"><tspan x="98" textLength="54" lengthAdjust="spacingAndGlyphs" class="tw">equipo</tspan><tspan x="161" textLength="18" lengthAdjust="spacingAndGlyphs" class="tw">de</tspan><tspan x="188" textLength="54" lengthAdjust="spacingAndGlyphs" class="ty-planta">planta</tspan><tspan x="251" textLength="99" lengthAdjust="spacingAndGlyphs" class="id">legendarios</tspan><tspan x="359" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">=</tspan><tspan x="377" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">[</tspan><tspan x="386" textLength="72" lengthAdjust="spacingAndGlyphs" class="s">"Mewtwo"</tspan><tspan x="458" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="476" textLength="63" lengthAdjust="spacingAndGlyphs" class="s">"Lugia"</tspan><tspan x="539" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="557" textLength="90" lengthAdjust="spacingAndGlyphs" class="s">"Rayquaza"</tspan><tspan x="647" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">]</tspan></text></g>
    <g class="linea" style="animation-delay:0.37s"><text x="44" y="147" class="n">4</text><text y="147"><tspan x="98" textLength="72" lengthAdjust="spacingAndGlyphs" class="k">entregar</tspan><tspan x="179" textLength="99" lengthAdjust="spacingAndGlyphs" class="id">legendarios</tspan><tspan x="287" textLength="72" lengthAdjust="spacingAndGlyphs" class="k">contiene</tspan><tspan x="368" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan></text></g>
    <g class="linea" style="animation-delay:0.46s"><text x="44" y="170" class="n">5</text><text y="170"><tspan x="62" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <g class="linea" style="animation-delay:0.55s"><text x="44" y="193" class="n">6</text></g>
    <g class="linea" style="animation-delay:0.64s"><text x="44" y="216" class="n">7</text><text y="216"><tspan x="62" textLength="63" lengthAdjust="spacingAndGlyphs" class="k">combate</tspan></text></g>
    <g class="linea" style="animation-delay:0.73s"><text x="44" y="239" class="n">8</text><text y="239"><tspan x="98" textLength="54" lengthAdjust="spacingAndGlyphs" class="ty-planta">planta</tspan><tspan x="161" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan></text></g>
    <g class="linea" style="animation-delay:0.82s"><text x="44" y="262" class="n">9</text><text y="262"><tspan x="98" textLength="36" lengthAdjust="spacingAndGlyphs" class="ty-roca">roca</tspan><tspan x="143" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">nivel</tspan></text></g>
    <g class="linea" style="animation-delay:0.91s"><text x="44" y="285" class="n">10</text><text y="285"><tspan x="98" textLength="72" lengthAdjust="spacingAndGlyphs" class="k">capturar</tspan><tspan x="170" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">(</tspan><tspan x="179" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan><tspan x="233" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="251" textLength="234" lengthAdjust="spacingAndGlyphs" class="s">"¿Qué Pokémon atrapaste? "</tspan><tspan x="485" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">)</tspan></text></g>
    <g class="linea" style="animation-delay:1.00s"><text x="44" y="308" class="n">11</text><text y="308"><tspan x="98" textLength="72" lengthAdjust="spacingAndGlyphs" class="k">capturar</tspan><tspan x="170" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">(</tspan><tspan x="179" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">nivel</tspan><tspan x="224" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="242" textLength="153" lengthAdjust="spacingAndGlyphs" class="s">"¿De qué nivel? "</tspan><tspan x="395" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">)</tspan></text></g>
    <g class="linea" style="animation-delay:1.09s"><text x="44" y="331" class="n">12</text></g>
    <g class="linea" style="animation-delay:1.18s"><text x="44" y="354" class="n">13</text><text y="354"><tspan x="98" textLength="18" lengthAdjust="spacingAndGlyphs" class="k">si</tspan><tspan x="125" textLength="117" lengthAdjust="spacingAndGlyphs" class="f">es_legendario</tspan><tspan x="242" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">(</tspan><tspan x="251" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan><tspan x="305" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">)</tspan></text></g>
    <g class="linea" style="animation-delay:1.27s"><text x="44" y="377" class="n">14</text><text y="377"><tspan x="134" textLength="54" lengthAdjust="spacingAndGlyphs" class="k">gritar</tspan><tspan x="197" textLength="126" lengthAdjust="spacingAndGlyphs" class="s">"¡Increíble! "</tspan><tspan x="323" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="341" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan><tspan x="395" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="413" textLength="144" lengthAdjust="spacingAndGlyphs" class="s">" es legendario"</tspan></text></g>
    <g class="linea" style="animation-delay:1.36s"><text x="44" y="400" class="n">15</text><text y="400"><tspan x="98" textLength="36" lengthAdjust="spacingAndGlyphs" class="k">sino</tspan><tspan x="143" textLength="18" lengthAdjust="spacingAndGlyphs" class="k">si</tspan><tspan x="170" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">nivel</tspan><tspan x="224" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">&gt;</tspan><tspan x="233" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">=</tspan><tspan x="251" textLength="18" lengthAdjust="spacingAndGlyphs" class="num">50</tspan></text></g>
    <g class="linea" style="animation-delay:1.45s"><text x="44" y="423" class="n">16</text><text y="423"><tspan x="134" textLength="54" lengthAdjust="spacingAndGlyphs" class="k">gritar</tspan><tspan x="197" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan><tspan x="251" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="269" textLength="225" lengthAdjust="spacingAndGlyphs" class="s">" ya es todo un veterano"</tspan></text></g>
    <g class="linea" style="animation-delay:1.54s"><text x="44" y="446" class="n">17</text><text y="446"><tspan x="98" textLength="36" lengthAdjust="spacingAndGlyphs" class="k">sino</tspan></text></g>
    <g class="linea" style="animation-delay:1.63s"><text x="44" y="469" class="n">18</text><text y="469"><tspan x="134" textLength="36" lengthAdjust="spacingAndGlyphs" class="ty-agua">agua</tspan><tspan x="179" textLength="72" lengthAdjust="spacingAndGlyphs" class="id">progreso</tspan><tspan x="260" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">=</tspan><tspan x="278" textLength="45" lengthAdjust="spacingAndGlyphs" class="id">nivel</tspan><tspan x="332" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">/</tspan><tspan x="350" textLength="27" lengthAdjust="spacingAndGlyphs" class="num">100</tspan></text></g>
    <g class="linea" style="animation-delay:1.72s"><text x="44" y="492" class="n">19</text><text y="492"><tspan x="134" textLength="54" lengthAdjust="spacingAndGlyphs" class="k">gritar</tspan><tspan x="197" textLength="54" lengthAdjust="spacingAndGlyphs" class="id">nombre</tspan><tspan x="251" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="269" textLength="81" lengthAdjust="spacingAndGlyphs" class="s">" va al "</tspan><tspan x="350" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="368" textLength="81" lengthAdjust="spacingAndGlyphs" class="k">redondear</tspan><tspan x="449" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">(</tspan><tspan x="458" textLength="72" lengthAdjust="spacingAndGlyphs" class="id">progreso</tspan><tspan x="539" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">*</tspan><tspan x="557" textLength="27" lengthAdjust="spacingAndGlyphs" class="num">100</tspan><tspan x="584" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">)</tspan><tspan x="593" textLength="9" lengthAdjust="spacingAndGlyphs" class="op">,</tspan><tspan x="611" textLength="126" lengthAdjust="spacingAndGlyphs" class="s">"% del camino"</tspan></text></g>
    <g class="linea" style="animation-delay:1.81s"><text x="44" y="515" class="n">20</text><text y="515"><tspan x="98" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <g class="linea" style="animation-delay:1.90s"><text x="44" y="538" class="n">21</text><text y="538"><tspan x="62" textLength="27" lengthAdjust="spacingAndGlyphs" class="k">fin</tspan></text></g>
    <!-- Salida -->
    <rect x="0" y="568" width="900" height="205" fill="#121328"/>
    <rect x="0" y="568" width="900" height="1" fill="#2c3060"/>
    <text x="24" y="596" style="font-size:12px; letter-spacing:2px" fill="#6b70a8">SALIDA</text>
    <g class="aparece" style="animation-delay:2.49s"><text x="24" y="626"><tspan fill="#8b90c0">¿Qué Pokémon atrapaste? </tspan><tspan fill="#ffcb05">› </tspan><tspan fill="#ffcb05">Eevee</tspan></text></g>
    <g class="aparece" style="animation-delay:3.39s"><text x="24" y="653"><tspan fill="#8b90c0">¿De qué nivel? </tspan><tspan fill="#ffcb05">› </tspan><tspan fill="#ffcb05">doce</tspan></text></g>
    <g class="aparece" style="animation-delay:4.29s"><text x="24" y="680"><tspan fill="#ffcb05" font-weight="700">¿Seguro?</tspan><tspan fill="#8b90c0"> "doce" no es un número roca. Intenta de nuevo.</tspan></text></g>
    <g class="aparece" style="animation-delay:4.74s"><text x="24" y="707"><tspan fill="#8b90c0">¿De qué nivel? </tspan><tspan fill="#ffcb05">› </tspan><tspan fill="#ffcb05">12</tspan></text></g>
    <g class="aparece" style="animation-delay:5.64s"><text x="24" y="734"><tspan fill="#e6e9ff">Eevee va al 12% del camino</tspan></text></g>
    <rect class="cursor" style="animation-delay:6.09s, 6.09s" x="24" y="747" width="9" height="17" fill="#ffcb05"/>
  </g>
</svg>
