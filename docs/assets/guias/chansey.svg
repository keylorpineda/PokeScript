<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Chansey: capturar se queda esperando lo que escribas. Si la respuesta no sirve, lo explica y vuelve a preguntar, con la paciencia de un Centro Pokémon.">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd4e2"/><stop offset="1" stop-color="#e0789a"/></linearGradient>
    <clipPath id="dialogo"><rect x="241" y="42" width="628" height="148"/></clipPath>
  </defs>
  <style>
    .entra { animation: entra 0.7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes entra { from { opacity: 0; transform: translateX(-70px); } to { opacity: 1; transform: none; } }
    .respira { animation: respira 2.6s ease-in-out 0.7s infinite; }
    @keyframes respira { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .sombra { transform-box: fill-box; transform-origin: center; animation: sombra 2.6s ease-in-out 0.7s infinite; }
    @keyframes sombra { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.88); } }
    .burbuja { opacity: 0; animation: burbuja 5.4s ease-out infinite; }
    @keyframes burbuja { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 0.7; } 100% { opacity: 0; transform: translateY(-170px); } }
    .flecha { opacity: 0; animation: flecha 0.9s steps(1) 5.00s infinite; }
    @keyframes flecha { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes l0 { to { transform: translateX(504px); } }
    @keyframes l1 { to { transform: translateX(564px); } }
    @keyframes l2 { to { transform: translateX(344px); } }
  </style>
  <rect width="900" height="220" rx="16" fill="url(#cielo)"/>
  <g opacity="0.55">
    <circle class="burbuja" cx="30" cy="200" r="3" fill="#ffffff" style="animation-delay:0.0s"/>
    <circle class="burbuja" cx="70" cy="188" r="4" fill="#ffffff" style="animation-delay:0.9s"/>
    <circle class="burbuja" cx="120" cy="176" r="5" fill="#ffffff" style="animation-delay:1.8s"/>
    <circle class="burbuja" cx="160" cy="200" r="3" fill="#ffffff" style="animation-delay:2.7s"/>
    <circle class="burbuja" cx="190" cy="188" r="4" fill="#ffffff" style="animation-delay:3.6s"/>
    <circle class="burbuja" cx="55" cy="176" r="5" fill="#ffffff" style="animation-delay:4.5s"/>
  </g>
  <ellipse cx="118" cy="192" rx="92" ry="18" fill="#e0789a" opacity="0.55"/>
  <ellipse class="sombra" cx="118" cy="190" rx="62" ry="9" fill="#000000" opacity="0.18"/>
  <g class="entra"><g class="respira">
    <image x="28" y="14" width="180" height="176" href="data:image/svg+xml;base64,"/>
  </g></g>
  <rect x="235" y="36" width="640" height="160" rx="12" fill="#ffffff" stroke="#2d2d3a" stroke-width="5"/>
  <rect x="242" y="43" width="626" height="146" rx="8" fill="none" stroke="#c8ccd8" stroke-width="2"/>
  <rect x="256" y="18" width="121" height="32" rx="8" fill="#2d2d3a"/>
  <text x="273" y="40" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="16" font-weight="900" letter-spacing="1" fill="#ffffff">CHANSEY</text>
  <g clip-path="url(#dialogo)">
    <text x="262" y="82" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" fill="#2d2d3a" textLength="500" lengthAdjust="spacingAndGlyphs"><tspan fill="#2458c8" font-weight="700">capturar</tspan> se queda esperando lo que escribas. Si la</text>
    <rect x="260" y="65" width="506" height="25" fill="#ffffff" style="animation: l0 1.50s steps(50, end) 0.80s both"/>
    <text x="262" y="112" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" fill="#2d2d3a" textLength="560" lengthAdjust="spacingAndGlyphs">respuesta no sirve, lo explica y vuelve a preguntar, con</text>
    <rect x="260" y="95" width="566" height="25" fill="#ffffff" style="animation: l1 1.68s steps(56, end) 2.30s both"/>
    <text x="262" y="142" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" fill="#2d2d3a" textLength="340" lengthAdjust="spacingAndGlyphs">la paciencia de un Centro Pokémon.</text>
    <rect x="260" y="125" width="346" height="25" fill="#ffffff" style="animation: l2 1.02s steps(34, end) 3.98s both"/>
  </g>
  <path class="flecha" d="M842 172 h18 l-9 10 z" fill="#e8603a"/>
</svg>
